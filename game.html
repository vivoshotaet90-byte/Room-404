function begin(load){aud();$('start').classList.add('h');started=true;busy=false;
 if(load&&sv){S={...S0,...sv.S};inv=sv.inv||[];if(sv.p&&ok(sv.p[0],sv.p[1])){cam.position.x=sv.p[0];cam.position.z=sv.p[1];yaw=sv.p[2]}}
 if(S.note)I.find(o=>o.userData.id==='note').visible=false;if(S.locker&&!S.key)keyM.visible=true;if(S.key)keyM.visible=false;
 if(S.fuse)I.find(o=>o.userData.id==='box').userData.off=0;
 for(const k of['d1','d2','d3','d4'])if(S[k]){openD(k);D[k].o.position[D[k].ax]=D[k].tgt}
 ui();
 try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
 setTimeout(()=>{if(!S.called)say('Красный телефон звонит…')},15000);
 setInterval(()=>{if(started&&!busy){thud();const l=lights[0];l.l.intensity=0;setTimeout(()=>l.l.intensity=l.i,900);if(rnd()<.5)say('Где-то вдалеке что-то упало…')}},45000)}

// loop
let last=performance.now(),bt=0,st=0,pt=0;
function loop(n){requestAnimationFrame(loop);try{loop2(n)}catch(e){const x=document.getElementById('err');x.style.display='block';x.textContent='ОШИБКА В ЦИКЛЕ: '+e.message+' | '+(e.stack||'').split('\n')[1]}}
function loop2(n){const dt=Math.min((n-last)/1000,.05);last=n;
 if(!busy){const fx=mv.x+(keys.KeyD?1:0)-(keys.KeyA?1:0),fz=mv.y+(keys.KeyS?1:0)-(keys.KeyW?1:0),sp=2.1*dt,c=Math.cos(yaw),s=Math.sin(yaw);
  const nx=cam.position.x+(fx*c+fz*s)*sp,nz=cam.position.z+(-fx*s+fz*c)*sp;if(ok(nx,cam.position.z))cam.position.x=nx;if(ok(cam.position.x,nz))cam.position.z=nz;
  if(Math.abs(fx)+Math.abs(fz)>.15){cam.position.y=1.6+Math.sin(n/230)*.03;if((st+=dt)>.5){st=0;step()}}}
 cam.rotation.set(pit,yaw,0);
 for(const d of Object.values(D)){const p=d.o.position[d.ax];if(Math.abs(p-d.tgt)>.001)d.o.position[d.ax]+=(d.tgt-p)*Math.min(1,dt*2.5)}
 const pz=cam.position.z;lights.forEach((o,i)=>{const f=rnd();if(i>0&&i!==2&&i!==1){const zs=[0,0,0,-6,-6,-16][i]||0;if(Math.abs(pz-zs)>7){o.l.intensity=0;return}}o.l.intensity=i===0?o.i*(f<.02?.15:1+Math.sin(n/120)*.04):o.i*(f>.99-(i>3?.01:0)?.2:1)});
 if(started&&!S.called&&(pt+=dt)>(S.loop?3:15)&&(bt+=dt)>2){bt=0;ringS()}
 look();R.render(sc,cam)}
R.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();save();say('Графика сбросилась. Откройте ⚙ и перезапустите игру.')});
setInterval(()=>{if(started&&!busy)save()},10000);
loop(last);
